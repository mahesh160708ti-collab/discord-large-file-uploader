services:
  postgres:
    image: postgres:16-alpine
    container_name: uploader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: uploader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uploader"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: uploader-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: uploader-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/discord-uploads --ignore-existing;
      /usr/bin/mc anonymous set download myminio/discord-uploads;
      exit 0;
      "

  app:
    build: .
    container_name: uploader-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/uploader
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: discord-uploads
      S3_REGION: auto
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      PORT: 3000
      BASE_URL: http://localhost:3000
      MAX_FILE_SIZE_BYTES: 2147483648
      DEFAULT_USER_QUOTA_BYTES: 5368709120
      ADMIN_DISCORD_USER_IDS: ${ADMIN_DISCORD_USER_IDS:-}

volumes:
  pgdata:
  miniodata:
